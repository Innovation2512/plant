<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Plant Dashboard 🌿</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .dark-mode { background-color: #1a1a1a; color: #f3f3f3; }
    .dark-mode .card { background-color: #2b2b2b; }
    .card { transition: background-color 0.3s; }
  </style>
</head>
<body class="bg-green-50 font-sans p-4 transition-all">
  <div class="flex flex-col sm:flex-row items-center justify-between mb-4">
    <h1 class="text-2xl sm:text-3xl font-bold text-green-800 dark:text-green-300">🌿 Smart Plant Dashboard</h1>
    <button onclick="toggleDarkMode()" class="mt-2 sm:mt-0 px-3 py-1 bg-gray-800 text-white rounded">🌓 Toggle Dark Mode</button>
  </div>

  <div class="mb-6 flex flex-col sm:flex-row items-center gap-4">
    <img src="http://mrsanghvi.ca/wp-content/uploads/2025/04/267z_large_1.jpg" class="w-20 h-20 rounded-xl border" alt="Plant Image">
    <div class="text-center sm:text-left">
      <h2 class="text-xl font-semibold">Pepper Plant 🌶️</h2>
      <p class="text-sm text-gray-500">Location: Kitchen Window</p>
    </div>
  </div>

  <button onclick="updateDashboard()" class="mb-4 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition text-sm sm:text-base">🔄 Refresh Now</button>

  <div class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-2 gap-4 mb-6">
    <div class="card bg-white p-4 rounded-xl shadow-md dark:bg-gray-800">
      <h2 class="text-lg font-semibold">💧 Moisture</h2>
      <p id="moisture" class="text-2xl mt-2">-- %</p>
    </div>
    <div class="card bg-white p-4 rounded-xl shadow-md dark:bg-gray-800">
      <h2 class="text-lg font-semibold">🌡️ Temperature</h2>
      <p id="temp" class="text-2xl mt-2">-- °C</p>
      <p id="alert" class="text-red-600 font-bold mt-2 hidden">⚠️ Low moisture! Please water your plant.</p>
    </div>
  </div>

  <div class="w-full overflow-x-auto">
    <canvas id="sensorChart" class="bg-white p-4 rounded-xl shadow-md dark:bg-gray-800 w-full max-w-full h-64 sm:h-80 md:h-96"></canvas>
  </div>

  <div class="mt-6 card bg-white p-4 rounded-xl shadow-md dark:bg-gray-800">
    <h2 class="text-lg font-semibold">🧠 Recommendation</h2>
    <p id="suggestion" class="mt-2 text-green-700 dark:text-green-300">--</p>
  </div>

  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSThY1jP-kMqE9CHoTYRrtVwh84J2QCE22fXStJuycb4MvwlsWEDc3sqcI8auw40zkuaOEc7BSaboCr/pub?output=csv";

    async function fetchCSV(url) {
      try {
        const response = await fetch(url);
        const text = await response.text();
        const rows = text.trim().split("\n").map(r => r.split(","));
        const headers = rows[0].map(h => h.trim().toLowerCase());
        const tsIndex = headers.indexOf("timestamp");
        const tempIndex = headers.indexOf("temperature");
        const moistureIndex = headers.indexOf("moisture");

        return rows.slice(1).map(row => ({
          timestamp: row[tsIndex],
          temp: parseFloat(row[tempIndex]),
          moisture: parseFloat(row[moistureIndex])
        })).filter(r => !isNaN(r.temp) && !isNaN(r.moisture));
      } catch (e) {
        console.error("CSV error:", e);
        return [];
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    async function updateDashboard() {
      const data = await fetchCSV(csvUrl);
      if (data.length === 0) return;

      const latest = data[data.length - 1];
      document.getElementById("temp").textContent = `${latest.temp.toFixed(1)} °C`;
      document.getElementById("moisture").textContent = `${latest.moisture.toFixed(1)} %`;

      const alert = document.getElementById("alert");
      const suggestion = document.getElementById("suggestion");

      if (latest.moisture < 30) {
        alert.classList.remove("hidden");
        suggestion.textContent = "Moisture is low. Water the plant soon!";
      } else if (latest.temp > 35) {
        alert.classList.add("hidden");
        suggestion.textContent = "It’s too hot! Move the plant to a cooler spot.";
      } else {
        alert.classList.add("hidden");
        suggestion.textContent = "All good! Your plant is doing well 🌿";
      }

      const labels = data.map(d => d.timestamp);
      const temps = data.map(d => d.temp);
      const moistures = data.map(d => d.moisture);

      const ctx = document.getElementById("sensorChart").getContext("2d");
      if (window.sensorChart && typeof window.sensorChart.destroy === "function") {
        window.sensorChart.destroy();
      }
      window.sensorChart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "Temperature (°C)",
              data: temps,
              borderColor: "rgb(234,88,12)",
              backgroundColor: "rgba(234,88,12,0.1)",
              borderWidth: 2,
              tension: 0.4
            },
            {
              label: "Moisture (%)",
              data: moistures,
              borderColor: "rgb(34,197,94)",
              backgroundColor: "rgba(34,197,94,0.1)",
              borderWidth: 2,
              tension: 0.4
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: {
                color: document.body.classList.contains("dark-mode") ? "#f3f3f3" : "#1f2937"
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    updateDashboard();
    setInterval(updateDashboard, 30000);
  </script>
</body>
</html>
